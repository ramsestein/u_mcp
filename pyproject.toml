[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umcp"
version = "0.1.0"
description = "Unified MCP Security Framework — Secure Agentic Framework with Privacy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "uMCP Contributors" },
]

keywords = ["mcp", "security", "privacy", "ai", "agent", "anonymization"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "fastmcp>=0.4.0",

    # Anonimización — BERT
    "transformers>=4.44.0",
    "torch>=2.4.0",

    # Anonimización — Aho-Corasick
    "pyahocorasick>=2.1.0",

    # Cifrado
    "cryptography>=43.0.0",

    # Cache
    "redis>=5.1.0",

    # Observabilidad
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.4.0",

    # CLI
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
umcp = "umcp.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src/umcp"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.coverage.json]
show_contexts = true